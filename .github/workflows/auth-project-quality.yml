name: Auth and Project Quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app/core app/api app/jobs app/modules/auth app/modules/audit app/modules/projects app/infrastructure/email
        working-directory: backend
      - run: pytest -q -m 'not live' --cov=app.modules.auth --cov=app.modules.audit --cov=app.modules.projects --cov=app.api --cov=app.core --cov=app.infrastructure.email --cov=app.infrastructure.queue --cov=app.jobs --cov-branch --cov-report=term-missing --cov-fail-under=90
        working-directory: backend
  live-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tql_auth_test
          POSTGRES_USER: tql_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tql_test -d tql_auth_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.22
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql+psycopg://tql_test:local-test-only@127.0.0.1:5432/tql_auth_test
      TEST_DATABASE_URL: postgresql+psycopg://tql_test:local-test-only@127.0.0.1:5432/tql_auth_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      RUN_LIVE_AUTH_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
      - name: Exercise real API, worker, PostgreSQL, Redis and SMTP
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/tql-api.log 2>&1 &
          celery -A app.infrastructure.queue.celery_app:celery_app worker --loglevel=warning --concurrency=2 >/tmp/tql-worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then break; fi
            sleep 1
          done
          pytest tests/live -q --tb=short
